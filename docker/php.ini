[PHP]
; Sensible production limits — override via env if needed
memory_limit        = 256M
upload_max_filesize = 20M
post_max_size       = 20M
max_execution_time  = 300
expose_php          = Off

[opcache]
opcache.enable                 = 1
opcache.memory_consumption     = 128
opcache.max_accelerated_files  = 10000
opcache.revalidate_freq        = 0
; In production we never change files at runtime, so disable timestamp check.
; Set to 1 if you volume-mount source code for development.
opcache.validate_timestamps    = 0
opcache.interned_strings_buffer = 8
opcache.fast_shutdown          = 1
