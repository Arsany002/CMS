[supervisord]
nodaemon   = true
logfile    = /dev/null
logfile_maxbytes = 0
; Write PID to /tmp because the container runs as www-data
pidfile    = /tmp/supervisord.pid
; Run as the container user (www-data); don't require root
user       = www-data

; ── PHP-FPM ──────────────────────────────────────────────────────────────────
[program:php-fpm]
command            = php-fpm --nodaemonize
autostart          = true
autorestart        = true
; Priority 1 — start php-fpm before nginx so FastCGI is ready
priority           = 1
stdout_logfile     = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile     = /dev/stderr
stderr_logfile_maxbytes = 0

; ── Nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command            = nginx -g "daemon off;"
autostart          = true
autorestart        = true
priority           = 2
stdout_logfile     = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile     = /dev/stderr
stderr_logfile_maxbytes = 0
