# Runs as www-data (non-root) — worker_processes auto works fine here.
user  www-data;
worker_processes  auto;

# Write PID to /tmp so www-data can create it without root
pid  /tmp/nginx.pid;

error_log  /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log to stdout/stderr so Docker captures them
    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    client_max_body_size  20M;

    # Hide server version
    server_tokens  off;

    # Gzip for API JSON responses
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_types       text/plain application/json application/javascript
                     text/css text/xml application/xml;

    # Write nginx temp files under /tmp (writable by www-data)
    client_body_temp_path  /tmp/nginx_client_body;
    proxy_temp_path        /tmp/nginx_proxy;
    fastcgi_temp_path      /tmp/nginx_fastcgi;
    uwsgi_temp_path        /tmp/nginx_uwsgi;
    scgi_temp_path         /tmp/nginx_scgi;

    include /etc/nginx/http.d/*.conf;
}
