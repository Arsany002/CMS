version: "3.9"

services:

  # ── Application (PHP-FPM + Nginx) ─────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    container_name: cms_app
    restart: unless-stopped
    environment:
      APP_ENV:            ${APP_ENV:-production}
      APP_KEY:            ${APP_KEY}
      APP_DEBUG:          "false"
      APP_URL:            ${APP_URL:-http://localhost}
      DB_CONNECTION:      mysql
      DB_HOST:            db
      DB_PORT:            3306
      DB_DATABASE:        ${DB_DATABASE:-cms_clinic}
      DB_USERNAME:        ${DB_USERNAME:-cms_user}
      DB_PASSWORD:        ${DB_PASSWORD}
      REDIS_HOST:         redis
      REDIS_PORT:         6379
      CACHE_STORE:        redis
      QUEUE_CONNECTION:   redis
      SESSION_DRIVER:     redis
    ports:
      - "8080:80"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Queue Worker ────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      target: production
    container_name: cms_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_ENV:          ${APP_ENV:-production}
      APP_KEY:          ${APP_KEY}
      DB_HOST:          db
      DB_DATABASE:      ${DB_DATABASE:-cms_clinic}
      DB_USERNAME:      ${DB_USERNAME:-cms_user}
      DB_PASSWORD:      ${DB_PASSWORD}
      REDIS_HOST:       redis
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - redis
    networks:
      - cms_network

  # ── Scheduler ──────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      target: production
    container_name: cms_scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    environment:
      APP_KEY:     ${APP_KEY}
      DB_HOST:     db
      DB_DATABASE: ${DB_DATABASE:-cms_clinic}
      DB_USERNAME: ${DB_USERNAME:-cms_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST:  redis
    depends_on:
      - app
    networks:
      - cms_network

  # ── MySQL ──────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: cms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-cms_clinic}
      MYSQL_USER:          ${DB_USERNAME:-cms_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - cms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: cms_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - cms_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
  app_storage:
  app_logs:

networks:
  cms_network:
    driver: bridge
